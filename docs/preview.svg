  <text x="40" y="237" font-family="Segoe UI, sans-serif" font-size="14" fill="#9aa7bd">▦  Productos</text>
  <text x="40" y="275" font-family="Segoe UI, sans-serif" font-size="14" fill="#9aa7bd">⚙  Ajustes</text>

  <text x="26" y="620" font-family="Segoe UI, sans-serif" font-size="11" fill="#93a1b8" letter-spacing="1.6">PERIODO</text>
