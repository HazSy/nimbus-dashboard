    <text x="292" y="682">Monitor UltraWide 34"</text>
    <text x="292" y="697" font-size="10.5" fill="#93a1b8">Pantallas</text>
    <text x="700" y="686" fill="#93a1b8">88</text>
    <text x="840" y="686" fill="#93a1b8">39.512 €</text>
    <rect x="1010" y="674" width="52" height="18" rx="9" fill="#94a3b8" fill-opacity="0.14"/>
    <text x="1036" y="687" font-size="11" fill="#93a1b8" text-anchor="middle">80 u.</text>
