  <text x="700" y="610" font-family="Segoe UI, sans-serif" font-size="11" fill="#93a1b8">Unidades</text>
  <text x="840" y="610" font-family="Segoe UI, sans-serif" font-size="11" fill="#93a1b8">Ingresos</text>
  <text x="1010" y="610" font-family="Segoe UI, sans-serif" font-size="11" fill="#93a1b8">Stock</text>
